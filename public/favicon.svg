<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- outer ring -->
  <circle cx="32" cy="32" r="31" fill="#1e7a45"/>
  <!-- light green left/base disc -->
  <circle cx="32" cy="32" r="28" fill="#4caf6e"/>
  <!-- dark green wedge (right side, angled like the reference) -->
  <path d="M32 32 L32 4 A28 28 0 0 1 52 54 Z" fill="#166534"/>
  <!-- dollar sign on the golden side -->
  <text x="20" y="43" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
  <!-- percent sign on the red side -->
  <text x="44" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">%</text>
</svg>
